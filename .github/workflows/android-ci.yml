name: Android CI Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Karti APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Prepare debug keystore and env
        run: |
          if [ ! -s debug.keystore ] && [ -f debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            echo "Generating fallback debug.keystore via keytool..."
            keytool -genkeypair -noprompt -v \
              -keystore debug.keystore \
              -storetype PKCS12 \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -lh debug.keystore
          if [ ! -f .env ]; then
            touch .env
          fi
          chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Robolectric SDK Artifact
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-android-all-15-robolectric-13954326-i7

      - name: Prefetch Robolectric SDK Artifact
        run: |
          M2_DIR="$HOME/.m2/repository/org/robolectric/android-all-instrumented/15-robolectric-13954326-i7"
          JAR_NAME="android-all-instrumented-15-robolectric-13954326-i7"
          mkdir -p "$M2_DIR"
          if [ ! -s "$M2_DIR/$JAR_NAME.jar" ]; then
            BASE_PATH="org/robolectric/android-all-instrumented/15-robolectric-13954326-i7"
            PRIMARY="https://maven-central.storage-download.googleapis.com/maven2/$BASE_PATH"
            FALLBACK="https://repo1.maven.org/maven2/$BASE_PATH"
            for ext in pom pom.sha512 jar jar.sha512; do
              curl -fSL --retry 5 --retry-delay 5 --retry-all-errors \
                "$PRIMARY/$JAR_NAME.$ext" -o "$M2_DIR/$JAR_NAME.$ext" || \
              curl -fSL --retry 5 --retry-delay 5 --retry-all-errors \
                "$FALLBACK/$JAR_NAME.$ext" -o "$M2_DIR/$JAR_NAME.$ext"
            done
            (cd "$M2_DIR" && echo "$(cat "$JAR_NAME.pom.sha512")  $JAR_NAME.pom" | sha512sum -c - && echo "$(cat "$JAR_NAME.jar.sha512")  $JAR_NAME.jar" | sha512sum -c -)
          fi

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: karti-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build Signed Release APK (if secrets configured)
        id: build_release
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            ./gradlew assembleRelease --no-daemon --stacktrace
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping release build (release signing secrets not configured)."
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Release APK Artifact (if built)
        if: steps.build_release.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: karti-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
